<link rel="stylesheet" href="./song-list.scss">

<!--Song List-->
<ul class="song-list">
    <!--Header row-->
    <li class="song-header">
        <span>Name</span>
        <span>Artist</span> 
        <span>Album</span>
        <span>Genre</span>
        <span>Duration</span>
    </li>

    <!--List Contents-->
    @for (song of songs; track song.id) {
        <li class="song-row">
            <app-song-details [song]="song" />
        </li>
    } @empty {
        <li class="song-empty">No songs available.</li>
    }

    <!--Only display if there is data available-->
    @if (songService.getSongs().length > 0) {
        <li class="song-list-summary">
            Total: {{ songService.getSongs().length }}
        </li>
    }
</ul>

<form>
    <div class="input-item">
        <label for="name">Name:</label>
        <input type="text" placeholder="e.g. Bohemian Rhapsody" name="name" required [value]="newSong().name" (input)="updateName($event)">
    </div>

    <div class="input-item">
        <label for="artist">Artist:</label>
        <input type="text" placeholder="e.g. Queen" name="artist" required [value]="newSong().artist" (input)="updateArtist($event)">
    </div>
    
    <div class="input-item">
        <label for="album">Album:</label>
        <input type="text" placeholder="e.g. A Night at the Opera" name="album" required [value]="newSong().album" (input)="updateAlbum($event)">
    </div>

    <div class="input-item">
        <label for="genre">Genre:</label>
        <input type="text" placeholder="e.g. Rock" name="genre" required [value]="newSong().genre" (input)="updateGenre($event)">
    </div>

    <div class="input-item">
        <label for="duration">Duration:</label>
        <input type="text" placeholder="e.g. 00:03:45" name="duration" required [value]="newSong().duration" (input)="updateDuration($event)">
    </div>

    <button (click)="addSong()" type="submit">Add Song</button>
</form>
