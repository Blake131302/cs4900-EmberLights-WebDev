<!--Song List-->
<ul class="song-list">
    <!--Header row-->
    <li class="song-header">
        <span>Name</span>
        <span>Artist</span> 
        <span>Album</span>
        <span>Genre</span>
        <span>Duration</span>
    </li>

    <!--List Contents-->
    @for (song of songs(); track song.songID) {
        <li class="song-row">
            <app-song-details [song]="song" />
        </li>
    } @empty {
        <li class="song-empty">No songs available.</li>
    }

    <!--Only display if there is data available-->
    @if (songs().length > 0) {
        <li class="song-list-summary">
            Total: {{ songs().length }}
        </li>
    }
</ul>

<!-- Song Input Form -->
<form>
    <div class="input-item">
        <label for="name">Name:</label>
        <input type="text" placeholder="e.g. Bohemian Rhapsody" name="name" required [value]="newSong().songName" (input)="updateName($event)">
    </div>
    
    <div class="input-item">
        <label for="albumID">AlbumID:</label>
        <input type="number" placeholder="e.g. 1" name="albumID" required [value]="newSong().albumID" (input)="updateAlbumID($event)">
    </div>

    <div class="input-item">
        <label for="genreID">GenreID:</label>
        <input type="number" placeholder="e.g. 1" name="genreID" required [value]="newSong().genreID" (input)="updateGenreID($event)">
    </div>

    <div class="input-item">
        <label for="duration">Duration:</label>
        <input type="text" placeholder="e.g. 00:03:45" name="duration" required [value]="newSong().songDuration" (input)="updateDuration($event)">
    </div>

    <button (click)="addSong()" type="button">Add Song</button>
</form>
