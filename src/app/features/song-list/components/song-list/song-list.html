<!--Song List-->
<ul class="song-list">
    <!--Header row-->
    <li class="song-header">
        <span>Name</span>
        <span>Artist</span> 
        <span>Album</span>
        <span>Genre</span>
        <span>Duration</span>
    </li>

    <!--List Contents-->
    @for (song of songs(); track song.songID) {
        <li class="song-row">
            <app-song-details [song]="song" />
            <span><button type="button" (click)="selectSongForEdit(song)">Edit</button></span>
        </li>
    } @empty {
        <li class="song-empty">No songs available.</li>
    }

    <!--Only display if there is data available-->
    @if (songs().length > 0) {
        <li class="song-list-summary">
            Total: {{ songs().length }}
        </li>
    }
</ul>

<!-- Song Input Form -->
<app-song-form 
    [songToEdit]="selectedSong()"
    (songCreated)="onSongCreated($event)"
    (songUpdated)="onSongUpdated($event)"
    (cancelEdit)="selectedSong.set(undefined)"
/>
