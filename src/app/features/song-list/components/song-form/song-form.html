<form [formGroup]="songForm" (ngSubmit)="onSubmit()">
    <div class="input-item">
        <label for="songName">Name:</label>
        <input name="songName" type="text" formControlName="songName" placeholder="e.g. Bones in the Ocean"/>
    </div>

    <div class="input-item">
        <label for="genreID">GenreID:</label>
        <input name="genreID" type="number" formControlName="genreID" placeholder="e.g. 1"/>
    </div>
    
    <div class="input-item">
        <label for="songDuration">Song Duration:</label>
        <input name="songDuration" type="text" formControlName="songDuration" placeholder="e.g. 00:03:45"/>
    </div>
    
    <div class="input-item">
        <label for="albumID">AlbumID</label>
        <input name="albumID" type="number" formControlName="albumID" placeholder="e.g. 1"/>
    </div>

    <button type="submit" [disabled]="songForm.invalid">Create</button>
</form>
