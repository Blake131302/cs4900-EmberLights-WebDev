<link rel="stylesheet" href="./song-list.scss">

<!--Song List-->
<ul class="song-list">
    <!--Header row-->
    <li class="song-header">
        <span>Name</span>
        <span>Artist</span> 
        <span>Album</span>
        <span>Genre</span>
        <span>Duration</span>
    </li>

    <!--List Contents-->
    @for (song of songs; track song.id) {
        <li class="song-row">
            <span>{{ song.name }}</span>
            <span>{{ song.artist }}</span>
            <span>{{ song.album }}</span>
            <span>{{ song.genre }}</span>
            <span>{{ song.duration }}</span>
        </li>
    } @empty {
        <li class="song-empty">No songs available.</li>
    }
</ul>
