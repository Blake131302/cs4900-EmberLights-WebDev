<h3>Playlist Songs</h3>

<div class="add-song">
  <input
    type="text"
    placeholder="Enter song name"
    [value]="newSongName()"
    (input)="newSongName.set($any($event.target).value)"
  />

  <button (click)="addSong()">Add Song</button>
</div>

<div class="song-list">
  @for (song of songs(); track song.id) {
    <app-song-detail-card [song]="song"></app-song-detail-card>
  }
</div>
