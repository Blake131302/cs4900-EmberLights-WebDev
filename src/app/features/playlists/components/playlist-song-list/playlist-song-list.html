<h3>Playlist Songs</h3>

<div class="add-song">
  <input
    type="text"
    placeholder="Enter song name"
    [value]="newSongName()"
    (input)="onSongNameInput($event)"
  />

  <button type="button" (click)="addSong()">Add Song</button>
</div>

<div class="song-list">
  @for (song of displayedSongs(); track song.id) {
    <app-song-detail-card [song]="song" />
  } @empty {
    <p>No songs in this playlist yet.</p>
  }
</div>
